<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0b0f19;border-radius:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f2942" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="topGlow" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Layer Gradients (Isometric 3D Slabs) -->
    <linearGradient id="layer6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="layer5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="slabShadow" x="-10%" y="-10%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGlow)"/>
  <rect width="1000" height="620" rx="16" fill="url(#topGlow)"/>

  <!-- Subtle 3D Perspective Grid Lines -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="150" y1="520" x2="500" y2="70"/>
    <line x1="300" y1="580" x2="650" y2="130"/>
    <line x1="500" y1="610" x2="850" y2="160"/>
    <line x1="850" y1="520" x2="500" y2="70"/>
    <line x1="700" y1="580" x2="350" y2="130"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">🌐 3D ARCHITECTURAL PIPELINE TOPOLOGY</text>
    <text x="0" y="24" font-size="13" font-weight="500" fill="#94a3b8">End-to-End Multilayer Machine Learning Lifecycle: Vector Tensors → Regularization → Boosting → Diagnostics → 3D Latent Clustering</text>
  </g>

  <!-- Central Vertical Axis Line -->
  <line x1="500" y1="130" x2="500" y2="530" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- ==================== LAYER 1: DATA INGESTION (BASE) ==================== -->
  <g transform="translate(0, 440)" filter="url(#slabShadow)">
    <!-- 3D Isometric Plane -->
    <polygon points="500,70 780,20 500,-30 220,20" fill="url(#layer1Grad)" stroke="#818cf8" stroke-width="1.5"/>
    <polygon points="220,20 500,70 500,85 220,35" fill="#312e81" opacity="0.9"/>
    <polygon points="780,20 500,70 500,85 780,35" fill="#1e1b4b" opacity="0.9"/>
    <!-- Content Label -->
    <circle cx="500" cy="20" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <text x="500" y="15" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PILLAR 1: TENSOR &amp; ARRAY FOUNDATIONS</text>
    <text x="500" y="32" text-anchor="middle" font-size="11" font-weight="500" fill="#e0e7ff">NumPy N-D Broadcasting • Pandas DataFrames • Vectorized Imputation</text>
  </g>

  <!-- Connecting Stream 1-2 -->
  <path d="M500,430 L500,380" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- ==================== LAYER 2: SUPERVISED CLASSIFICATION ==================== -->
  <g transform="translate(0, 360)" filter="url(#slabShadow)">
    <polygon points="500,70 760,22 500,-26 240,22" fill="url(#layer2Grad)" stroke="#fbbf24" stroke-width="1.5"/>
    <polygon points="240,22 500,70 500,85 240,37" fill="#78350f" opacity="0.9"/>
    <polygon points="760,22 500,70 500,85 760,37" fill="#451a03" opacity="0.9"/>
    <circle cx="500" cy="22" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <text x="500" y="17" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PILLAR 2: END-TO-END SUPERVISED PIPELINES</text>
    <text x="500" y="34" text-anchor="middle" font-size="11" font-weight="500" fill="#fef3c7">Titanic Classification • EDA • One-Hot Encoding • DecisionTreeClassifier</text>
  </g>

  <!-- Connecting Stream 2-3 -->
  <path d="M500,350 L500,300" stroke="#fde68a" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- ==================== LAYER 3: REGULARIZATION & SPARSITY ==================== -->
  <g transform="translate(0, 280)" filter="url(#slabShadow)">
    <polygon points="500,70 740,24 500,-22 260,24" fill="url(#layer3Grad)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="260,24 500,70 500,85 260,39" fill="#064e3b" opacity="0.9"/>
    <polygon points="740,24 500,70 500,85 740,39" fill="#022c22" opacity="0.9"/>
    <circle cx="500" cy="24" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <text x="500" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PILLAR 3: REGULARIZATION &amp; SHRINKAGE</text>
    <text x="500" y="36" text-anchor="middle" font-size="11" font-weight="500" fill="#d1fae5">Ridge (L2) • Lasso (L1 70% Sparsity) • ElasticNet Convex Combination</text>
  </g>

  <!-- Connecting Stream 3-4 -->
  <path d="M500,270 L500,220" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- ==================== LAYER 4: ENSEMBLE BOOSTING ==================== -->
  <g transform="translate(0, 200)" filter="url(#slabShadow)">
    <polygon points="500,70 720,26 500,-18 280,26" fill="url(#layer4Grad)" stroke="#22d3ee" stroke-width="1.5"/>
    <polygon points="280,26 500,70 500,85 280,41" fill="#164e63" opacity="0.9"/>
    <polygon points="720,26 500,70 500,85 720,41" fill="#083344" opacity="0.9"/>
    <circle cx="500" cy="26" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <text x="500" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PILLAR 4: SEQUENTIAL ENSEMBLE BOOSTING</text>
    <text x="500" y="38" text-anchor="middle" font-size="11" font-weight="500" fill="#cffafe">Decision Stumps • AdaBoost Sample Weighting • Gradient Boosting Residuals</text>
  </g>

  <!-- Connecting Stream 4-5 -->
  <path d="M500,190 L500,140" stroke="#67e8f9" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- ==================== LAYER 5: DIAGNOSTICS & CROSS-VALIDATION ==================== -->
  <g transform="translate(0, 120)" filter="url(#slabShadow)">
    <polygon points="500,70 700,28 500,-14 300,28" fill="url(#layer5Grad)" stroke="#60a5fa" stroke-width="1.5"/>
    <polygon points="300,28 500,70 500,85 300,43" fill="#1e3a8a" opacity="0.9"/>
    <polygon points="700,28 500,70 500,85 700,43" fill="#172554" opacity="0.9"/>
    <circle cx="500" cy="28" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    <text x="500" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PILLAR 5: DIAGNOSTICS &amp; 5-FOLD STRATIFIED CV</text>
    <text x="500" y="40" text-anchor="middle" font-size="11" font-weight="500" fill="#dbeafe">Dummy Baseline (62.7%) • Scaled Pipeline (98.2%) • ConfusionMatrixDisplay</text>
  </g>

  <!-- Connecting Stream 5-6 -->
  <path d="M500,110 L500,60" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- ==================== LAYER 6: 3D CUSTOMER CLUSTERING (APEX) ==================== -->
  <g transform="translate(0, 40)" filter="url(#slabShadow)">
    <polygon points="500,70 680,30 500,-10 320,30" fill="url(#layer6Grad)" stroke="#f472b6" stroke-width="2"/>
    <polygon points="320,30 500,70 500,85 320,45" fill="#701a75" opacity="0.9"/>
    <polygon points="680,30 500,70 500,85 680,45" fill="#4a044e" opacity="0.9"/>
    
    <!-- 3D Floating Centroid Crosses -->
    <circle cx="450" cy="20" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="540" cy="15" r="4" fill="#4ade80" filter="url(#neonGlow)"/>
    <circle cx="500" cy="35" r="4" fill="#facc15" filter="url(#neonGlow)"/>
    <circle cx="420" cy="35" r="4" fill="#f43f5e" filter="url(#neonGlow)"/>
    <circle cx="570" cy="30" r="4" fill="#c084fc" filter="url(#neonGlow)"/>

    <text x="500" y="18" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">PILLAR 6: 3D LATENT CUSTOMER SEGMENTATION</text>
    <text x="500" y="35" text-anchor="middle" font-size="11" font-weight="600" fill="#fce7f3">Inertia Elbow • Peak Silhouette (0.5547) • K=5 Personas • DBSCAN Density</text>
  </g>

  <!-- Interactive 3D Wireframe Indicator (Top Right Corner) -->
  <g transform="translate(830, 40)" opacity="0.85">
    <rect width="130" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">🌐 3D VISUALIZER</text>
    <text x="65" y="42" text-anchor="middle" font-size="9.5" fill="#cbd5e1">Interactive Plotly</text>
    <text x="65" y="56" text-anchor="middle" font-size="8.5" fill="#94a3b8">360° Free Rotation</text>
  </g>

  <!-- Metric Badges (Bottom Left / Right) -->
  <g transform="translate(50, 565)">
    <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">⚡ 98.25% Test Accuracy (LogReg)</text>
  </g>
  <g transform="translate(280, 565)">
    <rect width="200" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">✂️ 70% Lasso Feature Sparsity</text>
  </g>
  <g transform="translate(500, 565)">
    <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#f472b6">🛍️ 0.5547 Peak Silhouette (K=5)</text>
  </g>
  <g transform="translate(730, 565)">
    <rect width="220" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">🔄 5-Fold Stratified K-Fold CV</text>
  </g>

</svg>
